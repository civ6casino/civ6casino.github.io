<html lang="tr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyuncu Profili — Civ 6 Casino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-left">
    <div id="auth-widget" class="auth-widget"></div>

  </div>
  <nav>
    <a href="index.html">Şeref Listesi</a>
    <div class="nav-dropdown">
      <a href="oyun-tarihi.html">Oyun Tarihi</a>
      <div class="nav-dropdown-menu">
        <a href="oyun-tarihi.html#oyunlar">🗺️ Oyunlar</a>
        <a href="oyun-tarihi.html#arsiv">🖼️ Arşiv</a>
        <a href="oyun-tarihi.html#vakayiname">📖 Vakayiname</a>
      </div>
    </div>
    <div class="nav-dropdown">
      <a href="rules.html">Kurallar</a>
      <div class="nav-dropdown-menu">
        <a href="rules.html#puanlama">⚖️ Puanlama</a>
        <a href="rules.html#rozet">🏅 Rozetler</a>
        <a href="rules.html#ozel">🏺 Özel Kurallar</a>

<div class="hero-banner">
  <div class="hero-emblem">
    <svg class="laurel laurel-left" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 68 C 10 55, 8 40, 14 20 C 17 10, 20 4, 20 2" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/>
      <g fill="var(--accent-dim)">
        <ellipse cx="12" cy="58" rx="4" ry="9" transform="rotate(-35 12 58)"/>
        <ellipse cx="9" cy="46" rx="4" ry="9" transform="rotate(-40 9 46)"/>
        <ellipse cx="10" cy="34" rx="3.6" ry="8" transform="rotate(-30 10 34)"/>
        <ellipse cx="13" cy="23" rx="3.2" ry="7" transform="rotate(-25 13 23)"/>
        <ellipse cx="17" cy="13" rx="2.6" ry="6" transform="rotate(-18 17 13)"/>
      </g>
    </svg>
    <div class="crest-wrap">
      <div class="crest" id="profile-crest">🛡️</div>
      <button type="button" class="crest-edit-btn" id="crest-edit-btn" style="display:none;" title="Profil fotoğrafını değiştir">📷</button>
      <input type="file" id="avatar-file" accept="image/*" style="display:none;">
    </div>
    <svg class="laurel laurel-right" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 68 C 10 55, 8 40, 14 20 C 17 10, 20 4, 20 2" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/>
      <g fill="var(--accent-dim)">
        <ellipse cx="12" cy="58" rx="4" ry="9" transform="rotate(-35 12 58)"/>
        <ellipse cx="9" cy="46" rx="4" ry="9" transform="rotate(-40 9 46)"/>
        <ellipse cx="10" cy="34" rx="3.6" ry="8" transform="rotate(-30 10 34)"/>
        <ellipse cx="13" cy="23" rx="3.2" ry="7" transform="rotate(-25 13 23)"/>
        <ellipse cx="17" cy="13" rx="2.6" ry="6" transform="rotate(-18 17 13)"/>
      </g>
    </svg>
  </div>
  <h1 id="player-name-heading">Yükleniyor...</h1>
  <p id="avatar-msg" class="muted" style="min-height:1.2em;"></p>
</div>

<main>
  <section class="panel">
    <h2>📊 İstatistikler</h2>
    <div id="player-stats" class="muted">Yükleniyor...</div>
  </section>

  <section class="panel">
    <h2>🎵 Tema Müzikleri</h2>
    <div id="theme-songs" class="muted">Yükleniyor...</div>
  </section>

  <section class="panel">
    <h2>🏅 Kazanılan Rozetler</h2>
    <div id="badges-list" class="muted">Yükleniyor...</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const params = new URLSearchParams(location.search);
const playerName = params.get('oyuncu') || '';

document.getElementById('player-name-heading').textContent = playerName || 'Bilinmeyen Kahraman';

let linkedProfileId = null;

async function loadLinkedAccount() {
  if (!playerName) return;
  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('id, username, avatar_url')
    .eq('player_name', playerName)
    .maybeSingle();

  if (profile) {
    linkedProfileId = profile.id;
  }

  renderAvatarBlock(profile ? profile.avatar_url : null);
}

function renderHeroCrest(avatarUrl) {
  const crestEl = document.getElementById('profile-crest');
  if (avatarUrl) {
    crestEl.innerHTML = `<img class="crest-photo" src="${avatarUrl}" alt="">`;
  } else {
    crestEl.textContent = '🛡️';
  }
}

function renderAvatarBlock(avatarUrl) {
  renderHeroCrest(avatarUrl);
  const isOwnProfile = !!(Civ6Auth.currentUser && linkedProfileId === Civ6Auth.currentUser.id);
  document.getElementById('crest-edit-btn').style.display = isOwnProfile ? 'flex' : 'none';
}

function initAvatarUpload() {
  document.getElementById('crest-edit-btn').addEventListener('click', () => {
    document.getElementById('avatar-file').click();
  });

  document.getElementById('avatar-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msgEl = document.getElementById('avatar-msg');
    msgEl.textContent = 'Yükleniyor...';
    msgEl.className = 'muted';

    const path = `${Civ6Auth.currentUser.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;
    const { error: uploadErr } = await supabaseClient.storage.from('avatars').upload(path, file);
    if (uploadErr) {
      msgEl.textContent = 'Yüklenemedi: ' + uploadErr.message;
      msgEl.className = 'error';
      return;
    }
    const { data: pub } = supabaseClient.storage.from('avatars').getPublicUrl(path);
    const { error: updErr } = await supabaseClient.from('profiles').update({ avatar_url: pub.publicUrl }).eq('id', Civ6Auth.currentUser.id);
    if (updErr) {
      msgEl.textContent = 'Kaydedilemedi: ' + updErr.message;
      msgEl.className = 'error';
      return;
    }
    msgEl.textContent = 'Profil fotoğrafı güncellendi!';
    msgEl.className = 'success';
    renderAvatarBlock(pub.publicUrl);
  });
}

async function loadThemeSongs() {
  const el = document.getElementById('theme-songs');
  if (!playerName) {
    el.innerHTML = `<p class="muted">Oyuncu belirtilmedi.</p>`;
    return;
  }

  const { data: songs, error } = await supabaseClient
    .from('playlist_songs')
    .select('theme, song_name, song_url')
    .eq('author_name', playerName);

  if (error) {
    el.innerHTML = `<p class="error">Tema müzikleri yüklenemedi.</p>`;
    console.error(error);
    return;
  }

  const saldiri = (songs || []).find(s => s.theme === 'saldiri');
  const direnis = (songs || []).find(s => s.theme === 'direnis');

  function slot(label, song) {
    if (!song) return `<div class="theme-slot"><div class="theme-slot-label">${label}</div><div class="theme-slot-song muted">Henüz eklenmedi</div></div>`;
    return `
      <div class="theme-slot">
        <div class="theme-slot-label">${label}</div>
        <div class="theme-slot-song"><a href="${escapeHtml(song.song_url)}" target="_blank" rel="noopener">${escapeHtml(song.song_name)}</a></div>
      </div>
    `;
  }

  el.innerHTML = slot('🗡️ Saldırı', saldiri) + slot('🛡️ Direniş', direnis);
}

async function loadBadges() {
  const listEl = document.getElementById('badges-list');
  if (!playerName) {
    listEl.innerHTML = `<p class="muted">Oyuncu belirtilmedi.</p>`;
    return;
  }

  const { data: awards, error } = await supabaseClient
    .from('game_badges')
    .select('game_id, badges(name, icon, points, description), games(name, played_on, note)')
    .eq('player_name', playerName)
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = `<p class="error">Rozetler yüklenemedi.</p>`;
    console.error(error);
    return;
  }

  const valid = (awards || []).filter(a => a.badges);

  if (valid.length === 0) {
    listEl.innerHTML = `<p class="muted">Bu kahraman henüz bir rozet kazanmadı.</p>`;
    return;
  }

  listEl.innerHTML = valid.map(a => {
    const gameTitle = a.games ? (a.games.name || a.games.note || a.games.played_on) : null;
    return `
      <div class="member-row">
        <div class="member-info">
          <strong>${escapeHtml(a.badges.icon || '🏅')} ${escapeHtml(a.badges.name)}</strong>
          ${a.badges.points ? `<span class="pill">${a.badges.points > 0 ? '+' : ''}${formatPoints(a.badges.points)} puan</span>` : ''}
        </div>
        ${gameTitle ? `<a class="pill" href="oyun-detay.html?id=${a.game_id}">🎮 ${escapeHtml(gameTitle)}</a>` : ''}
      </div>
      ${a.badges.description ? `<p class="muted" style="margin:0 0 0.6rem;">${escapeHtml(a.badges.description)}</p>` : ''}
    `;
  }).join('');
}

async function loadStats() {
  const el = document.getElementById('player-stats');
  if (!playerName) {
    el.innerHTML = `<p class="muted">Oyuncu belirtilmedi.</p>`;
    return;
  }

  const { data: results, error } = await supabaseClient
    .from('results')
    .select('rank, points, civilization, games!inner(ranked, status)')
    .eq('player_name', playerName)
    .eq('games.ranked', true)
    .eq('games.status', 'completed');

  if (error) {
    el.innerHTML = `<p class="error">İstatistikler yüklenemedi.</p>`;
    console.error(error);
    return;
  }

  const totalGames = (results || []).length;

  if (totalGames === 0) {
    el.innerHTML = `<p class="muted">Bu kahraman henüz dereceli ve tamamlanmış bir oyuna katılmadı.</p>`;
    return;
  }

  // Rozet bonus puanları da (yalnızca dereceli/tamamlanmış oyunlarda) dahil edilir — Şeref Listesi ile aynı hesap.
  const { data: badgeAwards } = await supabaseClient
    .from('game_badges')
    .select('badges!inner(points), games!inner(ranked, status)')
    .eq('player_name', playerName)
    .eq('games.ranked', true)
    .eq('games.status', 'completed');

  const badgePoints = (badgeAwards || []).reduce((sum, a) => sum + Number(a.badges.points || 0), 0);

  const rankPoints = results.reduce((sum, r) => sum + Number(r.points), 0);
  const totalPoints = rankPoints + badgePoints;
  const avgRank = results.reduce((sum, r) => sum + Number(r.rank), 0) / totalGames;
  const wins = results.filter(r => r.rank === 1).length;
  const winRate = (wins / totalGames) * 100;

  const civCounts = {};
  results.forEach(r => {
    if (r.civilization) civCounts[r.civilization] = (civCounts[r.civilization] || 0) + 1;
  });
  const civEntries = Object.entries(civCounts).sort((a, b) => b[1] - a[1]);
  const civList = civEntries.length ? civEntries.map(([c, n]) => `${c}${n > 1 ? ` ×${n}` : ''}`).join(', ') : 'Henüz kaydedilmedi';

  const rows = [
    ['🎮 Oynanan Oyun', totalGames],
    ['🥇 Ortalama Sıralama', `${avgRank.toFixed(2)}. sıra`],
    ['🏆 Birincilik Sayısı', wins],
    ['📈 Kazanma Oranı', `%${winRate.toFixed(0)}`],
    ['⭐ Toplam Puan', formatPoints(totalPoints)],
    ['📊 Ortalama Puan / Oyun', formatPoints(totalPoints / totalGames)],
  ];

  el.innerHTML = `
    <table>
      <tbody>
        ${rows.map(([label, value]) => `<tr><td>${label}</td><td><strong>${value}</strong></td></tr>`).join('')}
      </tbody>
    </table>
    <p class="muted" style="margin-top:0.8rem; font-size:0.85rem;">Oynanan medeniyetler: ${civList}</p>
    <p class="muted" style="margin-top:0.4rem; font-size:0.8rem;">Yalnızca dereceli ve tamamlanmış oyunlar sayılır.</p>
  `;
}

function formatPoints(n) {
  n = Number(n);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

Civ6Auth.onChange(() => {
  loadLinkedAccount();
});

loadLinkedAccount();
loadBadges();
loadThemeSongs();
loadStats();
initAvatarUpload();
</script>
</body>
</html>
