<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyun Detayı — Civ 6 Casino</title>
<link rel="stylesheet" href="style.css">
</head>

  <nav>

<div class="hero-banner" id="hero-banner">
  <div class="hero-emblem">
    <svg class="laurel laurel-left" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 68 C 10 55, 8 40, 14 20 C 17 10, 20 4, 20 2" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/>
      <g fill="var(--accent-dim)">
        <ellipse cx="12" cy="58" rx="4" ry="9" transform="rotate(-35 12 58)"/>
        <ellipse cx="9" cy="46" rx="4" ry="9" transform="rotate(-40 9 46)"/>
        <ellipse cx="10" cy="34" rx="3.6" ry="8" transform="rotate(-30 10 34)"/>
        <ellipse cx="13" cy="23" rx="3.2" ry="7" transform="rotate(-25 13 23)"/>
        <ellipse cx="17" cy="13" rx="2.6" ry="6" transform="rotate(-18 17 13)"/>
      </g>
    </svg>
    <div class="crest">🗺️</div>
    <svg class="laurel laurel-right" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 68 C 10 55, 8 40, 14 20 C 17 10, 20 4, 20 2" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/>
      <g fill="var(--accent-dim)">
        <ellipse cx="12" cy="58" rx="4" ry="9" transform="rotate(-35 12 58)"/>
        <ellipse cx="9" cy="46" rx="4" ry="9" transform="rotate(-40 9 46)"/>
        <ellipse cx="10" cy="34" rx="3.6" ry="8" transform="rotate(-30 10 34)"/>
        <ellipse cx="13" cy="23" rx="3.2" ry="7" transform="rotate(-25 13 23)"/>
        <ellipse cx="17" cy="13" rx="2.6" ry="6" transform="rotate(-18 17 13)"/>
      </g>
    </svg>
  </div>
  <h1 id="game-title-heading">Yükleniyor...</h1>
  <p id="game-subtitle" class="muted"></p>
</div>

<main>
  <img id="cover-photo-display" class="cover-photo-box" style="display:none;" alt="">

  <section class="panel" id="gameinfo-panel" style="display:none;">
    <p id="gameinfo-lede" class="lede"></p>
  </section>

  <section class="panel" id="info-panel">
    <h2>📜 Genel Bilgi</h2>
    <div id="game-info" class="muted">Yükleniyor...</div>
  </section>

  <section class="panel" id="poll-panel" style="display:none;">
    <h2>🗳️ Anket</h2>
    <div id="poll-body"></div>
  </section>

  <section class="panel">
    <h2>📖 Bu Oyunun Vakayinamesi</h2>
    <div id="posts-list" class="muted">Yükleniyor...</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const params = new URLSearchParams(location.search);
const gameId = params.get('id') || '';

Civ6Auth.onChange(() => {
  loadPosts();
  loadPoll();
});

function excerptOf(body, maxLen = 180) {
  const plain = (body || '')
    .split('\n')
    .filter(line => !line.trim().match(/^!\[\]\(\S+\)$/))
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (plain.length <= maxLen) return plain;
  return plain.slice(0, maxLen).trim() + '…';
}

async function loadPosts() {
  const listEl = document.getElementById('posts-list');
  if (!gameId) return;

  const { data: posts, error } = await supabaseClient
    .from('posts')
    .select('id, title, body, author_name, is_anonymous, author_id, created_at, comments(id)')
    .eq('game_id', gameId)
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = `<p class="error">Yazılar yüklenemedi.</p>`;
    console.error(error);
    return;
  }

  if (!posts || posts.length === 0) {
    listEl.innerHTML = `<p class="muted">Bu oyuna bağlı bir yazı yok. İlk yazan sen ol!</p>`;
    return;
  }

  const avatarMap = await Civ6Auth.fetchAvatars(posts.filter(p => !p.is_anonymous).map(p => p.author_id));

  listEl.innerHTML = posts.map(p => {
    const authorLink = Civ6Auth.authorLinkHtml(p.is_anonymous ? null : p.author_name, avatarMap[p.author_id], { label: p.is_anonymous ? 'Anonim Vakanüvis' : undefined });
    const date = new Date(p.created_at).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });
    const canDelete = Civ6Auth.currentUser && (p.author_id === Civ6Auth.currentUser.id || Civ6Auth.isAdmin);
    const commentCount = (p.comments || []).length;

    return `
      <div class="post-card-compact">
        ${canDelete ? `<div class="card-actions"><button type="button" class="danger delete-post" data-id="${p.id}">Sil</button></div>` : ''}
        <h3><a href="yazi.html?id=${p.id}">${escapeHtml(p.title)}</a></h3>
        <div class="post-meta">${authorLink} tarafından · ${date} <a class="pill" href="yazi.html?id=${p.id}">💬 ${commentCount} yanıt</a></div>
        <p class="post-excerpt">${escapeHtml(excerptOf(p.body))}</p>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.delete-post').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu yazı silinsin mi?')) return;
      await supabaseClient.from('posts').delete().eq('id', btn.dataset.id);
      loadPosts();
    });
  });
}

async function loadGame() {
  const infoEl = document.getElementById('game-info');

  if (!gameId) {
    document.getElementById('game-title-heading').textContent = 'Oyun Bulunamadı';
    infoEl.innerHTML = `<p class="error">Bir oyun belirtilmedi.</p>`;
    return;
  }

  const { data: g, error } = await supabaseClient
    .from('games')
    .select('id, played_on, name, description, info_text, highlights, note, status, ranked, poll_closed, badges_finalized, victory_type, cover_image_url, results(player_name, rank, points, civilization), game_images(image_url), game_badges(player_name, badges(name, icon, points))')
    .eq('id', gameId)
    .maybeSingle();

  if (error || !g) {
    document.getElementById('game-title-heading').textContent = 'Oyun Bulunamadı';
    infoEl.innerHTML = `<p class="error">Bu oyun yüklenemedi ya da mevcut değil.</p>`;
    console.error(error);
    return;
  }

  currentGame = g;

  const title = g.name || g.note || `${g.played_on} tarihli oyun`;
  document.getElementById('game-title-heading').textContent = title;

  if (g.info_text) {
    document.getElementById('gameinfo-panel').style.display = 'block';
    document.getElementById('gameinfo-lede').textContent = g.info_text;
  }

  const statusText = g.status === 'completed' ? 'Tamamlandı' : 'Devam Ediyor';
  const rankedText = g.ranked ? 'Dereceli' : 'Derecesiz';
  document.getElementById('game-subtitle').textContent = `${g.played_on} · ${statusText} · ${rankedText}`;

  if (g.cover_image_url) {
    const coverEl = document.getElementById('cover-photo-display');
    coverEl.src = g.cover_image_url;
    coverEl.style.display = 'block';
  }

  const sortedResults = (g.results || []).slice().sort((a, b) => a.rank - b.rank);
  const awardedBadges = (g.game_badges || []).filter(a => a.badges);

  const VICTORY_ICONS = {
    'Teslim': '🏳️',
    'Bilim Zaferi': '🔬',
    'Kültür Zaferi': '🎭',
    'Din Zaferi': '⛪',
    'Diplomasi Zaferi': '🕊️',
    'Askeri Zafer': '⚔️'
  };

  infoEl.innerHTML = `
    ${g.victory_type ? `<p><span class="pill">${VICTORY_ICONS[g.victory_type] || '🏆'} ${escapeHtml(g.victory_type)}</span></p>` : ''}
    ${g.description ? `<p>${escapeHtml(g.description)}</p>` : ''}
    ${sortedResults.length ? `<ol>${sortedResults.map(r => `<li>${escapeHtml(r.player_name)}${r.civilization ? ` (${escapeHtml(r.civilization)})` : ''} — ${r.points} puan</li>`).join('')}</ol>` : '<p class="muted">Henüz sonuç girilmedi.</p>'}
    ${awardedBadges.length ? `
      <p class="muted">${awardedBadges.map(a => `${escapeHtml(a.badges.icon || '🏅')} <a href="profil.html?oyuncu=${encodeURIComponent(a.player_name)}">${escapeHtml(a.player_name)}</a>: ${escapeHtml(a.badges.name)}${a.badges.points ? ` (${a.badges.points > 0 ? '+' : ''}${formatPoints(a.badges.points)} puan)` : ''}`).join(' · ')}</p>
    ` : ''}
    ${g.highlights ? `<p class="post-body">${escapeHtml(g.highlights)}</p>` : ''}
  `;

  const images = g.game_images || [];
  if (images.length > 0) {
    const heroEl = document.getElementById('hero-banner');
    heroEl.classList.add('hero-photo', 'game-photo-hero');
    heroEl.style.backgroundImage = `url('${images[0].image_url}')`;
    heroEl.insertAdjacentHTML('afterend', '<div class="hero-fade-mask" aria-hidden="true"></div>');
  }

  await loadPoll();
}

const ROSTER = ['Yusuf', 'Eren', 'Arda', 'Alperen', 'Taha', 'Ayaz'];
let currentGame = null;

async function loadPoll() {
  const panel = document.getElementById('poll-panel');
  const bodyEl = document.getElementById('poll-body');
  const g = currentGame;
  if (!g) return;

  if (g.badges_finalized) {
    panel.style.display = 'none';
    return;
  }

  const winner = (g.results || []).find(r => r.rank === 1);
  if (!winner || g.status !== 'completed') {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';

  if (g.poll_closed) {
    bodyEl.innerHTML = `<p class="muted">Bu oyunun anketi kapatıldı.</p>`;
    return;
  }

  if (!Civ6Auth.currentUser) {
    bodyEl.innerHTML = `<p class="muted">Oy vermek için üst köşedeki <strong>Giriş Yap</strong> düğmesini kullan.</p>`;
    return;
  }

  if (!Civ6Auth.playerName) {
    bodyEl.innerHTML = `<p class="muted">Ankete katılmak için hesabının Şeref Listesi'ndeki bir oyuncuyla bağlantılı olması gerekir. Bunun için bir yöneticiyle konuş.</p>`;
    return;
  }

  const myName = Civ6Auth.playerName;
  const mvpCandidates = ROSTER.filter(n => n !== myName && n !== winner.player_name);
  const oathbreakerCandidates = ROSTER.filter(n => n !== myName);
  const oneManArmyCandidates = ROSTER.filter(n => n !== myName);

  const { data: existingVote } = await supabaseClient
    .from('game_poll_votes')
    .select('deserved_win, player_name, oathbreaker_player_name, one_man_army_player_name')
    .eq('game_id', g.id)
    .eq('voter_id', Civ6Auth.currentUser.id)
    .maybeSingle();

  bodyEl.innerHTML = `
    <p class="muted">Kazanan: <strong>${escapeHtml(winner.player_name)}</strong></p>
    <label>Saygınlık: Kazanan bu zaferi hak etti mi?</label>
    <div class="checkbox-row">
      <label style="margin:0; text-transform:none;"><input type="radio" name="poll-deserved" value="yes" style="width:auto;" ${existingVote && existingVote.deserved_win === true ? 'checked' : ''}> Evet</label>
      <label style="margin:0; text-transform:none;"><input type="radio" name="poll-deserved" value="no" style="width:auto;" ${existingVote && existingVote.deserved_win === false ? 'checked' : ''}> Hayır</label>
    </div>
    <label for="poll-mvp-select">Sence MVP olmayı bu oyunda kim hak etti?</label>
    <select id="poll-mvp-select">
      <option value="">— Seç —</option>
      ${mvpCandidates.map(n => `<option value="${n}"${existingVote && existingVote.player_name === n ? ' selected' : ''}>${n}</option>`).join('')}
    </select>
    <label for="poll-oathbreaker-select">Oathbreaker: Ettiği yeminleri, bağlandığı ilkeleri ve antlaşmaları sikine taşşağına sürdü.</label>
    <select id="poll-oathbreaker-select">
      <option value="">— Seç —</option>
      <option value="__none__"${existingVote && existingVote.oathbreaker_player_name === null ? ' selected' : ''}>🚫 Kimse</option>
      ${oathbreakerCandidates.map(n => `<option value="${n}"${existingVote && existingVote.oathbreaker_player_name === n ? ' selected' : ''}>${n}</option>`).join('')}
    </select>
    <label for="poll-onemanarmy-select">Tek Kişilik Ordu: 3V1'e karşı elendi ancak pes etmedi.</label>
    <select id="poll-onemanarmy-select">
      <option value="">— Seç —</option>
      <option value="__none__"${existingVote && existingVote.one_man_army_player_name === null ? ' selected' : ''}>🚫 Kimse</option>
      ${oneManArmyCandidates.map(n => `<option value="${n}"${existingVote && existingVote.one_man_army_player_name === n ? ' selected' : ''}>${n}</option>`).join('')}
    </select>
    <button id="poll-submit-btn">${existingVote ? 'Oyunu Güncelle' : 'Oyla'}</button>
    <div id="poll-msg"></div>
  `;

  document.getElementById('poll-submit-btn').addEventListener('click', async () => {
    const msgEl = document.getElementById('poll-msg');
    msgEl.textContent = '';
    msgEl.className = '';

    const deservedInput = document.querySelector('input[name="poll-deserved"]:checked');
    const mvpSelect = document.getElementById('poll-mvp-select');
    const oathbreakerSelect = document.getElementById('poll-oathbreaker-select');
    const oneManArmySelect = document.getElementById('poll-onemanarmy-select');

    if (!deservedInput) {
      msgEl.textContent = 'Lütfen bir seçim yap.';
      msgEl.className = 'error';
      return;
    }
    if (!mvpSelect.value) {
      msgEl.textContent = 'Lütfen bir MVP seç.';
      msgEl.className = 'error';
      return;
    }

    const oathbreakerValue = oathbreakerSelect.value === '__none__' ? null : (oathbreakerSelect.value || null);
    const oneManArmyValue = oneManArmySelect.value === '__none__' ? null : (oneManArmySelect.value || null);

    const { error } = await supabaseClient
      .from('game_poll_votes')
      .upsert({
        game_id: g.id,
        voter_id: Civ6Auth.currentUser.id,
        deserved_win: deservedInput.value === 'yes',
        player_name: mvpSelect.value,
        oathbreaker_player_name: oathbreakerValue,
        one_man_army_player_name: oneManArmyValue,
        updated_at: new Date().toISOString()
      }, { onConflict: 'game_id,voter_id' });

    if (error) {
      msgEl.textContent = 'Kaydedilemedi: ' + error.message;
      msgEl.className = 'error';
      return;
    }

    msgEl.textContent = 'Oyun kaydedildi!';
    msgEl.className = 'success';
    document.getElementById('poll-submit-btn').textContent = 'Oyunu Güncelle';
  });
}

function formatPoints(n) {
  n = Number(n);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadGame();
loadPosts();
</script>
</body>
