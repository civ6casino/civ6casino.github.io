<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Civ 6 Casino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-left">
    <div id="auth-widget" class="auth-widget"></div>
    <h1>🏛️ Civ 6 Casino</h1>
  </div>
  <nav>
    <a href="index.html">Şeref Listesi</a>
    <a href="oyun-tarihi.html">Oyun Tarihi</a>
    <a href="rules.html">Kurallar</a>
    <a href="blog.html" class="active">Blog</a>
    <a href="playlist.html">Çalma Listesi</a>

      <path d="M20 68 C 10 55, 8 40, 14 20 C 17 10, 20 4, 20 2" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/>
      <g fill="var(--accent-dim)">
        <ellipse cx="12" cy="58" rx="4" ry="9" transform="rotate(-35 12 58)"/>
        <ellipse cx="9" cy="46" rx="4" ry="9" transform="rotate(-40 9 46)"/>
        <ellipse cx="10" cy="34" rx="3.6" ry="8" transform="rotate(-30 10 34)"/>
        <ellipse cx="13" cy="23" rx="3.2" ry="7" transform="rotate(-25 13 23)"/>
        <ellipse cx="17" cy="13" rx="2.6" ry="6" transform="rotate(-18 17 13)"/>
      </g>
    </svg>
    <div class="crest">📖</div>
    <svg class="laurel laurel-right" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 68 C 10 55, 8 40, 14 20 C 17 10, 20 4, 20 2" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/>
      <g fill="var(--accent-dim)">
        <ellipse cx="12" cy="58" rx="4" ry="9" transform="rotate(-35 12 58)"/>
        <ellipse cx="9" cy="46" rx="4" ry="9" transform="rotate(-40 9 46)"/>
        <ellipse cx="10" cy="34" rx="3.6" ry="8" transform="rotate(-30 10 34)"/>
        <ellipse cx="13" cy="23" rx="3.2" ry="7" transform="rotate(-25 13 23)"/>
        <ellipse cx="17" cy="13" rx="2.6" ry="6" transform="rotate(-18 17 13)"/>
      </g>
    </svg>
  </div>
  <h1>İmparatorluğun Vakayinameleri</h1>
  <p>Bu masadaki medeniyetlerden hikayeler, övünmeler ve savaş raporları.</p>
</div>

<main>
  <section class="panel">
    <h2>📜 Son Kayıtlar</h2>
    <div id="posts-list" class="muted">Yükleniyor...</div>
  </section>

  <section class="panel" id="compose-panel" style="display:none;">
    <h2>✍️ Yeni Bir Kayıt Yaz</h2>
    <label for="post-title">Başlık</label>
    <input type="text" id="post-title" placeholder="örn. Persepolis'in Düşüşü">
    <label for="post-body">Hikaye</label>
    <textarea id="post-body" placeholder="Hikayeni anlat... İmleci istediğin yere koyup 'Resim Ekle' ile araya fotoğraf serpiştirebilirsin." style="min-height:200px;"></textarea>
    <div class="checkbox-row" style="margin-top:0.6rem;">
      <button type="button" id="post-image-insert-btn" class="secondary">🖼️ Resim Ekle</button>
      <input type="file" id="post-image-insert-file" accept="image/*" style="display:none;">
      <span id="post-image-status" class="muted"></span>
    </div>
    <label for="post-game-select">İlgili Oyun (isteğe bağlı)</label>
    <select id="post-game-select">
      <option value="">— Yok —</option>
    </select>
    <label for="post-audio">🔊 Sesli Özet (isteğe bağlı)</label>
    <input type="file" id="post-audio" accept="audio/*">
    <div class="checkbox-row">
      <input type="checkbox" id="post-anonymous">
      <label for="post-anonymous">Anonim olarak paylaş</label>
    </div>
    <button id="post-submit-btn">Kaydı Yayınla</button>
    <div id="post-msg"></div>
  </section>

  <section class="panel" id="login-hint">
    <p class="muted">Kayıt yazmak için üst köşedeki <strong>Giriş Yap</strong> düğmesini kullan.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const composePanel = document.getElementById('compose-panel');
const loginHint = document.getElementById('login-hint');
const postGameSelect = document.getElementById('post-game-select');

let gamesCache = [];

Civ6Auth.onChange(() => {
  const loggedIn = !!(Civ6Auth.currentUser && Civ6Auth.currentUsername);
  composePanel.style.display = loggedIn ? 'block' : 'none';
  loginHint.style.display = loggedIn ? 'none' : 'block';
  loadPosts();
});

function gameLabel(g) {
  return g.name || g.played_on;
}

function gameOptionsHtml(selectedId) {
  return '<option value="">— Yok —</option>' + gamesCache.map(g =>
    `<option value="${g.id}"${g.id === selectedId ? ' selected' : ''}>${escapeHtml(gameLabel(g))}</option>`
  ).join('');
}

async function loadGamesCache() {
  const { data: games } = await supabaseClient
    .from('games')
    .select('id, name, played_on')
    .order('created_at', { ascending: false });
  gamesCache = games || [];
  postGameSelect.innerHTML = gameOptionsHtml('');
}

// Metin kutusunun imleç konumuna metin ekler (resim eklemek için kullanılır)
function insertAtCursor(textarea, text) {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const before = textarea.value.slice(0, start);
  const after = textarea.value.slice(end);
  textarea.value = before + text + after;
  const cursorPos = start + text.length;
  textarea.focus();
  textarea.setSelectionRange(cursorPos, cursorPos);
}

async function uploadPostImage(file) {
  const path = `${Civ6Auth.currentUser.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;
  const { error: uploadErr } = await supabaseClient.storage.from('blog-images').upload(path, file);
  if (uploadErr) throw uploadErr;
  const { data: publicUrlData } = supabaseClient.storage.from('blog-images').getPublicUrl(path);
  return publicUrlData.publicUrl;
}

async function uploadPostAudio(file) {
  const path = `${Civ6Auth.currentUser.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;
  const { error: uploadErr } = await supabaseClient.storage.from('blog-audio').upload(path, file);
  if (uploadErr) throw uploadErr;
  const { data: publicUrlData } = supabaseClient.storage.from('blog-audio').getPublicUrl(path);
  return publicUrlData.publicUrl;
}

// Basit satır-tabanlı biçimlendirme: tek başına bir satırda ![](url) ise resim,
// boş satır paragraf arası, diğer her şey düz metin (kaçışlı).
function renderPostBody(body) {
  const lines = (body || '').split('\n');
  let html = '';
  let buffer = [];

  function flush() {
    if (buffer.length) {
      html += `<p>${buffer.map(escapeHtml).join('<br>')}</p>`;
      buffer = [];
    }
  }

  lines.forEach(line => {
    const trimmed = line.trim();
    const m = trimmed.match(/^!\[\]\((\S+)\)$/);
    if (m) {
      flush();
      html += `<img class="post-image" src="${escapeHtml(m[1])}" alt="">`;
    } else if (trimmed === '') {
      flush();
    } else {
      buffer.push(line);
    }
  });
  flush();
  return html;
}

// --- Kayıt oluşturma paneli: Resim Ekle düğmesi ---
document.getElementById('post-image-insert-btn').addEventListener('click', () => {
  document.getElementById('post-image-insert-file').click();
});

document.getElementById('post-image-insert-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('post-image-status');
  statusEl.textContent = 'Resim yükleniyor...';
  statusEl.className = 'muted';
  try {
    const url = await uploadPostImage(file);
    insertAtCursor(document.getElementById('post-body'), `\n![](${url})\n`);
    statusEl.textContent = 'Resim eklendi.';
    statusEl.className = 'success';
  } catch (err) {
    statusEl.textContent = 'Resim yüklenemedi: ' + err.message;
    statusEl.className = 'error';
  }
  e.target.value = '';
});

document.getElementById('post-submit-btn').addEventListener('click', async () => {
  const msgEl = document.getElementById('post-msg');
  msgEl.textContent = '';
  msgEl.className = '';

  if (!Civ6Auth.currentUser || !Civ6Auth.currentUsername) {
    msgEl.textContent = 'Kayıt yazmak için giriş yapmalısın.';
    msgEl.className = 'error';
    return;
  }

  const title = document.getElementById('post-title').value.trim();
  const body = document.getElementById('post-body').value.trim();
  const isAnonymous = document.getElementById('post-anonymous').checked;
  const gameId = postGameSelect.value || null;
  const audioInput = document.getElementById('post-audio');
  const audioFile = audioInput.files[0];

  if (!title || !body) {
    msgEl.textContent = 'Lütfen bir başlık ve biraz hikaye metni ekle.';
    msgEl.className = 'error';
    return;
  }

  let audioUrl = null;
  if (audioFile) {
    try {
      audioUrl = await uploadPostAudio(audioFile);
    } catch (err) {
      msgEl.textContent = 'Sesli özet yüklenemedi: ' + err.message;
      msgEl.className = 'error';
      return;
    }
  }

  const { error: insertErr } = await supabaseClient.from('posts').insert({
    author_id: Civ6Auth.currentUser.id,
    author_name: Civ6Auth.currentUsername,
    is_anonymous: isAnonymous,
    title,
    body,
    game_id: gameId,
    audio_url: audioUrl
  });

  if (insertErr) {
    msgEl.textContent = 'Yayınlama başarısız oldu: ' + insertErr.message;
    msgEl.className = 'error';
    return;
  }

  msgEl.textContent = 'Kayıt yayınlandı!';
  msgEl.className = 'success';
  document.getElementById('post-title').value = '';
  document.getElementById('post-body').value = '';
  document.getElementById('post-anonymous').checked = false;
  document.getElementById('post-image-status').textContent = '';
  postGameSelect.value = '';
  audioInput.value = '';
  loadPosts();
});

async function loadPosts() {
  const listEl = document.getElementById('posts-list');

  await loadGamesCache();

  const { data: posts, error } = await supabaseClient
    .from('posts')
    .select('id, title, body, image_url, audio_url, author_name, is_anonymous, author_id, created_at, game_id, games(name, played_on), comments(id)')
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = `<p class="error">Kayıtlar yüklenemedi.</p>`;
    console.error(error);
    return;
  }

  if (!posts || posts.length === 0) {
    listEl.innerHTML = `<p class="muted">Henüz kayıt yok. İlk yazan sen ol!</p>`;
    return;
  }

  const loggedIn = !!(Civ6Auth.currentUser && Civ6Auth.currentUsername);
  const avatarMap = await Civ6Auth.fetchAvatars(posts.filter(p => !p.is_anonymous).map(p => p.author_id));

  listEl.innerHTML = posts.map(p => {
    const displayName = p.is_anonymous ? 'Anonim Vakanüvis' : escapeHtml(p.author_name || 'Bilinmiyor');
    const avatar = p.is_anonymous ? Civ6Auth.avatarHtml(null) : Civ6Auth.avatarHtml(avatarMap[p.author_id]);
    const date = new Date(p.created_at).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });
    const canEdit = Civ6Auth.currentUser && (p.author_id === Civ6Auth.currentUser.id || Civ6Auth.isAdmin);
    const gameTag = p.games ? `<a class="pill" href="oyun-tarihi.html#game-${p.game_id}">🎮 ${escapeHtml(gameLabel(p.games))}</a>` : '';
    // Eski gönderilerin tekil resmi (image_url) henüz düzenlenmediyse en üstte gösterilmeye devam eder.
    const legacyImage = p.image_url ? `<img class="post-image" src="${escapeHtml(p.image_url)}" alt="">` : '';
    const commentCount = (p.comments || []).length;

    return `
      <div class="post-card" id="post-${p.id}">
        <div id="view-${p.id}">
          ${canEdit ? `
            <div class="card-actions">
              <button class="edit-post" data-id="${p.id}">Düzenle</button>
              <button class="danger delete-post" data-id="${p.id}">Sil</button>
            </div>
          ` : ''}
          <h3>${escapeHtml(p.title)}</h3>
          <div class="post-meta">${avatar}${displayName} tarafından · ${date} ${gameTag} <button type="button" class="pill toggle-comments-btn" data-id="${p.id}">💬 ${commentCount} yanıt</button></div>
          ${p.audio_url ? `<audio controls src="${escapeHtml(p.audio_url)}"></audio>` : ''}
          ${legacyImage}
          <div class="post-body">${renderPostBody(p.body)}</div>
          <div class="comments-section" id="comments-${p.id}" style="display:none;">
            <div class="comments-list" id="comments-list-${p.id}"></div>
            ${loggedIn ? `
              <div class="comment-compose">
                <textarea class="comment-body-input" maxlength="500" placeholder="Bir yanıt yaz..."></textarea>
                <div class="checkbox-row">
                  <input type="checkbox" class="comment-anonymous-input" id="comment-anon-${p.id}">
                  <label for="comment-anon-${p.id}">Anonim olarak paylaş</label>
                </div>
                <button type="button" class="comment-submit-btn" data-id="${p.id}">Yanıtla</button>
                <div class="comment-msg"></div>
              </div>
            ` : `<p class="muted">Yanıt yazmak için giriş yapmalısın.</p>`}
          </div>
        </div>
        ${canEdit ? `
        <div class="edit-form" id="edit-form-${p.id}" style="display:none; margin-top:1rem;">
          <label>Başlık</label>
          <input type="text" class="edit-title" value="${escapeHtml(p.title)}">
          <label>Hikaye</label>
          <textarea class="edit-body" style="min-height:200px;">${escapeHtml(p.image_url ? `![](${p.image_url})\n\n${p.body}` : p.body)}</textarea>
          <div class="checkbox-row" style="margin-top:0.6rem;">
            <button type="button" class="secondary edit-image-insert-btn">🖼️ Resim Ekle</button>
            <input type="file" class="edit-image-insert-file" accept="image/*" style="display:none;">
            <span class="edit-image-status muted"></span>
          </div>
          <label>İlgili Oyun</label>
          <select class="edit-game-select">${gameOptionsHtml(p.game_id)}</select>
          ${p.audio_url ? `
            <label>Mevcut Sesli Özet</label>
            <audio controls src="${escapeHtml(p.audio_url)}" style="width:100%;"></audio>
            <div class="checkbox-row">
              <input type="checkbox" class="edit-remove-audio" id="rm-audio-${p.id}">
              <label for="rm-audio-${p.id}">Sesli özeti kaldır</label>
            </div>
          ` : ''}
          <label>${p.audio_url ? 'Sesli Özeti Değiştir' : '🔊 Sesli Özet Ekle'} (isteğe bağlı)</label>
          <input type="file" class="edit-audio-file" accept="audio/*">
          <div class="checkbox-row">
            <input type="checkbox" class="edit-anonymous" id="anon-${p.id}" ${p.is_anonymous ? 'checked' : ''}>
            <label for="anon-${p.id}">Anonim olarak paylaş</label>
          </div>
          <button class="edit-save-btn" data-id="${p.id}">Kaydet</button>
          <button type="button" class="secondary edit-cancel-btn" data-id="${p.id}">Vazgeç</button>
          <div class="edit-msg"></div>
        </div>` : ''}
      </div>
    `;
  }).join('');

  document.querySelectorAll('.delete-post').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu kayıt silinsin mi?')) return;
      await supabaseClient.from('posts').delete().eq('id', btn.dataset.id);
      loadPosts();
    });
  });

  document.querySelectorAll('.edit-post').forEach(btn => {
    btn.addEventListener('click', () => toggleEditForm(btn.dataset.id));
  });

  document.querySelectorAll('.edit-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleEditForm(btn.dataset.id));
  });

  document.querySelectorAll('.edit-form').forEach(formEl => {
    const insertBtn = formEl.querySelector('.edit-image-insert-btn');
    const insertFile = formEl.querySelector('.edit-image-insert-file');
    insertBtn.addEventListener('click', () => insertFile.click());
    insertFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = formEl.querySelector('.edit-image-status');
      statusEl.textContent = 'Resim yükleniyor...';
      statusEl.className = 'edit-image-status muted';
      try {
        const url = await uploadPostImage(file);
        insertAtCursor(formEl.querySelector('.edit-body'), `\n![](${url})\n`);
        statusEl.textContent = 'Resim eklendi.';
        statusEl.className = 'edit-image-status success';
      } catch (err) {
        statusEl.textContent = 'Resim yüklenemedi: ' + err.message;
        statusEl.className = 'edit-image-status error';
      }
      e.target.value = '';
    });
  });

  document.querySelectorAll('.edit-save-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const postId = btn.dataset.id;
      const post = posts.find(x => x.id === postId);
      const formEl = document.getElementById(`edit-form-${postId}`);
      submitPostEdit(postId, formEl, post.audio_url);
    });
  });

  document.querySelectorAll('.toggle-comments-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.id;
      const section = document.getElementById(`comments-${postId}`);
      const opening = section.style.display !== 'block';
      section.style.display = opening ? 'block' : 'none';
      if (opening && !loadedCommentSections[postId]) {
        loadedCommentSections[postId] = true;
        await loadCommentsForPost(postId);
      }
    });
  });

  document.querySelectorAll('.comment-submit-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.id;
      const container = btn.closest('.comment-compose');
      const msgEl = container.querySelector('.comment-msg');
      const bodyInput = container.querySelector('.comment-body-input');
      const anonInput = container.querySelector('.comment-anonymous-input');
      const body = bodyInput.value.trim();

      msgEl.textContent = '';
      msgEl.className = '';

      if (!body) {
        msgEl.textContent = 'Boş bir yanıt gönderemezsin.';
        msgEl.className = 'error';
        return;
      }

      const { error } = await supabaseClient.from('comments').insert({
        post_id: postId,
        author_id: Civ6Auth.currentUser.id,
        author_name: Civ6Auth.currentUsername,
        is_anonymous: anonInput.checked,
        body
      });

      if (error) {
        msgEl.textContent = 'Gönderilemedi: ' + error.message;
        msgEl.className = 'error';
        return;
      }

      bodyInput.value = '';
      anonInput.checked = false;
      loadedCommentSections[postId] = true;
      await loadCommentsForPost(postId);
      await refreshCommentCount(postId);
    });
  });
}

const loadedCommentSections = {};

async function loadCommentsForPost(postId) {
  const listEl = document.getElementById(`comments-list-${postId}`);
  listEl.innerHTML = `<p class="muted">Yükleniyor...</p>`;

  const { data: comments, error } = await supabaseClient
    .from('comments')
    .select('id, author_id, author_name, is_anonymous, body, created_at')
    .eq('post_id', postId)
    .order('created_at', { ascending: true });

  if (error) {
    listEl.innerHTML = `<p class="error">Yanıtlar yüklenemedi.</p>`;
    console.error(error);
    return;
  }

  if (!comments || comments.length === 0) {
    listEl.innerHTML = `<p class="muted">Henüz yanıt yok. İlk yazan sen ol!</p>`;
    return;
  }

  const avatarMap = await Civ6Auth.fetchAvatars(comments.filter(c => !c.is_anonymous).map(c => c.author_id));

  listEl.innerHTML = comments.map(c => {
    const displayName = c.is_anonymous ? 'Anonim Yorumcu' : escapeHtml(c.author_name || 'Bilinmiyor');
    const avatar = c.is_anonymous ? Civ6Auth.avatarHtml(null) : Civ6Auth.avatarHtml(avatarMap[c.author_id]);
    const date = new Date(c.created_at).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });
    const canDelete = Civ6Auth.currentUser && (c.author_id === Civ6Auth.currentUser.id || Civ6Auth.isAdmin);
    return `
      <div class="comment-row">
        <div class="comment-meta">
          ${avatar}<strong>${displayName}</strong> <span class="muted">· ${date}</span>
          ${canDelete ? `<button type="button" class="danger delete-comment-btn" data-id="${c.id}" data-post-id="${postId}">Sil</button>` : ''}
        </div>
        <div class="comment-body">${escapeHtml(c.body)}</div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.delete-comment-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu yanıt silinsin mi?')) return;
      await supabaseClient.from('comments').delete().eq('id', btn.dataset.id);
      await loadCommentsForPost(btn.dataset.postId);
      await refreshCommentCount(btn.dataset.postId);
    });
  });
}

async function refreshCommentCount(postId) {
  const { count } = await supabaseClient
    .from('comments')
    .select('id', { count: 'exact', head: true })
    .eq('post_id', postId);

  const btn = document.querySelector(`.toggle-comments-btn[data-id="${postId}"]`);
  if (btn) btn.textContent = `💬 ${count || 0} yanıt`;
}

function toggleEditForm(postId) {
  const view = document.getElementById(`view-${postId}`);
  const form = document.getElementById(`edit-form-${postId}`);
  const opening = form.style.display !== 'block';
  form.style.display = opening ? 'block' : 'none';
  view.style.display = opening ? 'none' : 'block';
}

async function submitPostEdit(postId, formEl, currentAudioUrl) {
  const msgEl = formEl.querySelector('.edit-msg');
  msgEl.textContent = '';
  msgEl.className = '';

  const title = formEl.querySelector('.edit-title').value.trim();
  const body = formEl.querySelector('.edit-body').value.trim();
  const gameId = formEl.querySelector('.edit-game-select').value || null;
  const isAnonymous = formEl.querySelector('.edit-anonymous').checked;
  const removeAudioEl = formEl.querySelector('.edit-remove-audio');
  const removeAudio = removeAudioEl ? removeAudioEl.checked : false;
  const audioFile = formEl.querySelector('.edit-audio-file').files[0];

  if (!title || !body) {
    msgEl.textContent = 'Lütfen bir başlık ve biraz hikaye metni ekle.';
    msgEl.className = 'error';
    return;
  }

  let audioUrl = currentAudioUrl || null;

  if (audioFile) {
    try {
      audioUrl = await uploadPostAudio(audioFile);
    } catch (err) {
      msgEl.textContent = 'Sesli özet yüklenemedi: ' + err.message;
      msgEl.className = 'error';
      return;
    }
  } else if (removeAudio) {
    audioUrl = null;
  }

  // Eski tekil resim (image_url) bu düzenlemeyle birlikte metnin içine taşındı;
  // bundan sonra o alan boşaltılır, resim artık body içindeki ![](...) satırında yaşıyor.
  const { error: updateErr } = await supabaseClient
    .from('posts')
    .update({ title, body, is_anonymous: isAnonymous, game_id: gameId, audio_url: audioUrl, image_url: null })
    .eq('id', postId);

  if (updateErr) {
    msgEl.textContent = 'Güncellenemedi: ' + updateErr.message;
    msgEl.className = 'error';
    return;
  }

  loadPosts();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadPosts();
</script>
